 <text x="190" y="380" text-anchor="middle" font-size="23" font-weight="600">A · 折叠双屏</text>
 <text x="540" y="380" text-anchor="middle" font-size="23" font-weight="600">B · 倾斜 θ</text>
 <text x="890" y="380" text-anchor="middle" font-size="23" font-weight="600">C · 负形双舱</text>
