<g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#24304B">
 <text x="60" y="58" font-size="30" font-weight="600">Theta / 图标方向</text>
 <text x="60" y="90" font-size="16" fill="#626D83">让符号对应行动与双屏，而不只是把字母放在色块上。</text>
