name: Eta Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 与打包并行且不接触签名 Secrets；失败不影响 APK 上传，但会阻止发版草稿
  verify:
    name: Lint 与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # PR 合并后的构建：若已有 PR Check 在完全相同的代码树上通过，就不再重复跑 Lint 与测试。
      # 只比较树哈希，任何内容差异都会重新检查；发版标签始终完整检查。
      - name: 复用 PR Check 结果
        id: reuse
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          heads="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pr-check.yml/runs?status=success&per_page=20" \
            --jq '.workflow_runs[].head_sha' 2>/dev/null || true)"
          for sha in $heads; do
            pr_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq '.tree.sha' 2>/dev/null || true)"
            if [[ "$pr_tree" == "$tree" ]]; then
              echo "PR Check 已在相同代码树（提交 ${sha::7}）上通过，跳过重复检查。"
              echo "verified=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "未找到相同代码树的 PR Check，执行完整检查。"

      - name: 配置构建环境
        if: steps.reuse.outputs.verified != 'true'
        uses: ./.github/actions/setup-build

      - name: Lint 与单元测试
        if: steps.reuse.outputs.verified != 'true'
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          :app:lintDebug :app:testDebugUnitTest

      - name: 上传检查报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-apks:
    name: 构建 Debug 与 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      # 非发版构建的 versionCode 取提交时间（北京时间）的 yyyyMMdd + 当日 15 分钟时段（00–95）：
      # 同一提交重复构建结果一致，后续提交单调递增，可直接覆盖安装。
      - name: 生成构建版本号
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            exit 0
          fi
          commit_time="$(git log -1 --format=%ct HEAD)"
          day="$(TZ=Asia/Shanghai date -d "@$commit_time" +%Y%m%d)"
          hour="$(TZ=Asia/Shanghai date -d "@$commit_time" +%H)"
          minute="$(TZ=Asia/Shanghai date -d "@$commit_time" +%M)"
          slot=$(( 10#$hour * 4 + 10#$minute / 15 ))
          printf 'code=%s%02d\n' "$day" "$slot" >> "$GITHUB_OUTPUT"

      - name: 构建 Debug APK
        env:
          CI_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          metadata_arg=()
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            metadata_arg=("-Peta.buildMetadata=${GITHUB_SHA::7}" "-Peta.versionCode=$CI_VERSION_CODE")
          fi
          ./gradlew --no-daemon --no-configuration-cache "${metadata_arg[@]}" \
            :app:assembleDebug

      - name: 验证并整理 Debug APK
        id: debug-apk
        run: |
          shopt -s nullglob
          debug_apks=(app/build/outputs/apk/debug/Eta-v*.apk)
          if [[ ${#debug_apks[@]} -ne 1 ]]; then
            echo "::error::Debug APK 数量异常（${#debug_apks[@]}）。"
            exit 1
          fi
          echo "debug_path=${debug_apks[0]}" >> "$GITHUB_OUTPUT"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.debug-apk.outputs.debug_path }}
          archive: false
          if-no-files-found: error
          # fork 是公开仓库：APK 产物只留 1 天，供自己下载测试，不长期对外分发。
          retention-days: 1

      - name: 还原发布证书
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$ETA_RELEASE_KEYSTORE_BASE64" ||
                -z "$ETA_RELEASE_STORE_PASSWORD" ||
                -z "$ETA_RELEASE_KEY_ALIAS" ||
                -z "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::缺少 Release 签名 Secrets，请检查仓库的 Actions Secrets。"
            exit 1
          fi
          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/eta-release.jks"

      - name: 构建 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
          CI_VERSION_CODE: ${{ steps.version.outputs.code }}
        # 发版标签保持纯净版本名；其余构建追加 +<短提交号>，与已发布版本区分
        run: |
          metadata_arg=()
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            metadata_arg=("-Peta.buildMetadata=${GITHUB_SHA::7}" "-Peta.versionCode=$CI_VERSION_CODE")
          fi
          ./gradlew --no-daemon --no-configuration-cache "${metadata_arg[@]}" \
            :app:assembleRelease

      - name: 验证并整理 Release APK
        id: apk
        run: |
          # 文件名由 Gradle 按 versionName 生成，例如 Eta-vX.Y.Z.apk、Eta-vX.Y.Z-debug+<sha>.apk
          shopt -s nullglob
          debug_apks=(app/build/outputs/apk/debug/Eta-v*.apk)
          release_apks=(app/build/outputs/apk/release/Eta-v*.apk)
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [[ ${#debug_apks[@]} -ne 1 ]]; then
            echo "::error::Debug APK 数量异常（${#debug_apks[@]}）。"
            exit 1
          fi
          if [[ ${#release_apks[@]} -ne 1 ]]; then
            echo "::error::Release APK 数量异常（${#release_apks[@]}）。"
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          "$apksigner_path" verify "${release_apks[0]}"

          # 发版标签必须与 versionName 一致，避免标签与安装包版本错位
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version_name="$(jq -r '.elements[0].versionName' \
              app/build/outputs/apk/release/output-metadata.json)"
            if [[ "$GITHUB_REF_NAME" != "v$version_name" ]]; then
              echo "::error::标签 $GITHUB_REF_NAME 与 versionName $version_name 不一致。"
              exit 1
            fi
          fi
          echo "debug_path=${debug_apks[0]}" >> "$GITHUB_OUTPUT"
          echo "release_path=${release_apks[0]}" >> "$GITHUB_OUTPUT"

      - name: 上传 Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          # fork 是公开仓库：APK 产物只留 1 天，供自己下载测试，不长期对外分发。
          retention-days: 1

      - name: 清理发布证书
        if: always()
        run: rm -f "$RUNNER_TEMP/eta-release.jks"

  # virtual-screen 构建的 APK Artifact 只留 1 天；另存为 Release 草稿（仅仓库维护者可见、不创建标签），保留最近 5 个
  dev-draft:
    name: 保存构建草稿
    needs: [verify, build-apks]
    if: github.ref_type != 'tag' && github.ref_name == 'virtual-screen'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 下载 APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: Eta-v*.apk
          path: ${{ runner.temp }}/apk
          merge-multiple: true

      - name: 创建草稿并清理旧草稿
        env:
          GH_TOKEN: ${{ github.token }}
          APK_DIR: ${{ runner.temp }}/apk
        run: |
          shopt -s nullglob
          release_apks=()
          for apk in "$APK_DIR"/Eta-v*.apk; do
            [[ "$apk" == *-debug* ]] || release_apks+=("$apk")
          done
          if [[ ${#release_apks[@]} -ne 1 ]]; then
            echo "::error::Release APK 数量异常（${#release_apks[@]}）。"
            exit 1
          fi
          tag="build-${GITHUB_SHA::7}"
          existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$existing" == "false" ]]; then
            echo "::error::$tag 已是公开 Release，不覆盖。"
            exit 1
          fi
          if [[ "$existing" == "true" ]]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          apk_name="$(basename "${release_apks[0]}")"
          notes="virtual-screen 构建 ${GITHUB_SHA::7}，运行 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          SHA-256: $(sha256sum "${release_apks[0]}" | cut -d' ' -f1)
          仅供测试，未经真机验收前不要发布。"
          gh release create "$tag" "${release_apks[0]}" \
            --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "${apk_name%.apk}" --notes "$notes"
          # 只清理本工作流创建的 build-* 草稿，按创建时间保留最近 5 个
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isDraft,createdAt \
            --jq '[.[] | select(.isDraft and (.tagName | startswith("build-")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r old; do
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes
              done

  # 构建 job 持有签名 Secrets，写 Release 的权限单独放在这里，且只在发版标签上运行
  draft-release:
    name: 创建 Release 草稿
    needs: [verify, build-apks]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # 未压缩上传的 Artifact 以文件名命名。文件名不经 job outputs 传递：
      # 输出值只要包含任一 Secret 的子串就会被 Actions 整体丢弃，下载步骤随之退化为下载全部产物。
      # 标签已在构建 job 中校验等于 v<versionName>，Gradle 产物名为 Eta-v<versionName>.apk，可直接由标签推导。
      - name: 下载 Release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Eta-${{ github.ref_name }}.apk
          path: ${{ runner.temp }}/release

      # 只建草稿：草稿不会出现在 releases/latest，App 内更新检查要等维护者手动发布后才可见
      - name: 创建 Release 草稿
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ runner.temp }}/release/Eta-${{ github.ref_name }}.apk
        run: |
          release_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            "${release_args[@]}"
